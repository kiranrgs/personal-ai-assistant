[pytest]
; Ensures `import src...` resolves to the repo root regardless of how pytest
; is invoked (plain `pytest`, `python -m pytest`, or from CI) - without this,
; bare `pytest tests/ -v` (no `-m`) never adds the repo root to sys.path,
; which is why CI failed with "ModuleNotFoundError: No module named 'src'"
; even though it passed locally (where `python -m pytest` was used instead,
; which does add the current directory to sys.path).
pythonpath = .
